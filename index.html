<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia SaaS – Entrar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <!-- ESCOLHA DE PAPEL -->
  <div class="auth-card" id="roleChoice">
    <h1 class="auth-logo">🏋️ Treino<span>App</span></h1>
    <p class="auth-subtitle">Como você quer entrar?</p>
    <div class="role-choice">
      <button class="role-btn" data-role="professor">
        <span class="role-btn__icon">🧑‍🏫</span>
        <span class="role-btn__label">Sou Professor</span>
      </button>
      <button class="role-btn" data-role="aluno">
        <span class="role-btn__icon">💪</span>
        <span class="role-btn__label">Sou Aluno</span>
      </button>
    </div>
  </div>

  <!-- LOGIN PROFESSOR -->
  <div class="auth-card" id="cardProfessor" hidden>
    <button class="auth-back" data-back>← Voltar</button>
    <h1 class="auth-logo">🧑‍🏫 Área do<span> Professor</span></h1>

    <div class="auth-tabs">
      <button class="auth-tab is-active" data-tab="login-professor">Entrar</button>
      <button class="auth-tab" data-tab="signup-professor">Criar conta</button>
    </div>

    <form id="loginProfessorForm" class="auth-form" data-role="professor">
      <label>E-mail
        <input type="email" name="email" required placeholder="voce@email.com">
      </label>
      <label>Senha
        <input type="password" name="senha" required placeholder="••••••••" minlength="6">
      </label>
      <p class="auth-error" id="loginProfessorError" hidden></p>
      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
    </form>

    <form id="signupForm" class="auth-form" hidden>
      <label>Seu nome
        <input type="text" name="nome" required placeholder="Seu nome completo">
      </label>
      <label>E-mail
        <input type="email" name="email" required placeholder="voce@email.com">
      </label>
      <label>Senha
        <input type="password" name="senha" required placeholder="Mínimo 6 caracteres" minlength="6">
      </label>
      <p class="auth-error" id="signupError" hidden></p>
      <button type="submit" class="btn btn--primary btn--block">Criar conta e começar</button>
    </form>
  </div>

  <!-- LOGIN ALUNO -->
  <div class="auth-card" id="cardAluno" hidden>
    <button class="auth-back" data-back>← Voltar</button>
    <h1 class="auth-logo">💪 Área do<span> Aluno</span></h1>
    <p class="auth-subtitle">Seu professor cria seu acesso — use o e-mail e senha que ele te passou.</p>

    <form id="loginAlunoForm" class="auth-form" data-role="aluno">
      <label>E-mail
        <input type="email" name="email" required placeholder="voce@email.com">
      </label>
      <label>Senha
        <input type="password" name="senha" required placeholder="••••••••" minlength="6">
      </label>
      <p class="auth-error" id="loginAlunoError" hidden></p>
      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
    </form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
